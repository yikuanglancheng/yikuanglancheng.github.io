name: Get Citation Data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/google_scholar_crawler.yaml'
      - 'google_scholar_crawler/**'

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: google_scholar_crawler/requirements.txt
      - name: Install crawler dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Check dependency compatibility
        run: |
          python -m pip check
          python -c "from scholarly import scholarly; from bibtexparser.bibdatabase import BibDatabase"
      - name: Check out citation data branch
        uses: actions/checkout@v6
        with:
          ref: google-scholar-stats
          path: citation-data
      - name: Fetch Google Scholar citations
        env:
          GOOGLE_SCHOLAR_ID: hbwPRacAAAAJ
        run: python google_scholar_crawler/main.py --output-dir citation-data
      - name: Publish citation data
        working-directory: citation-data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo 'Citation data is unchanged.'
          else
            git commit -m 'Update Google Scholar citation data'
            git push origin HEAD:google-scholar-stats
          fi
